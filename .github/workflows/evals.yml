name: Skill evals

# Behavioural evals: each case in evals/ runs with and without the plugin and
# grades the code the agent writes. They call the model, so they cost money and
# run only on demand. Requires the ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs per case per arm'
        default: '3'
      tag:
        description: 'Only cases with this tag (blank = all)'
        default: ''

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ github.event.inputs.runs }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          args=(plugin eval . --trust-plugin --no-publish --runs "$RUNS" --threshold 0.8
                --model claude-sonnet-5-5 --judge-model claude-haiku-5-5
                --max-cost-usd 25 --json evals/results/ci.json --report evals/results/report.html
                --scaffold --allow-tools 'Bash(node:*)')
          # --scaffold runs our own evals/*/scaffold.sh (runs-check-froala installs froala-editor into the run's
          # workspace); the Bash grant lets that case run node <skill>/scripts/check-froala.mjs, and only cases
          # that list Bash in allowed_tools can use it.
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          npx --yes @anthropic-ai/claude-code@2.1.328 "${args[@]}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: evals/results/
