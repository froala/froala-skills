name: Validate skills

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1' # every Monday: compare the skills with the latest Froala release
  workflow_dispatch:
    inputs:
      froala:
        description: 'froala-editor version to check against ("declared", "latest" or x.y.z)'
        default: 'declared'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; the tag is in the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Negative tests (the validator must catch known-bad examples)
        run: node tests/run-negative-tests.mjs
      - name: Project checker tests (skills/*/scripts/check-froala.mjs)
        run: node tests/check-froala.test.mjs
      - name: Check skills (PRs and pushes use the version the skills declare)
        if: github.event_name != 'schedule'
        env:
          FROALA_VERSION: ${{ github.event.inputs.froala || 'declared' }}
        run: node scripts/validate-skills.mjs --froala "$FROALA_VERSION"
      - name: Check skills against the latest release (weekly)
        if: github.event_name == 'schedule'
        run: node scripts/validate-skills.mjs --froala latest --strict-version --check-links

  plugin-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Manifests are valid JSON
        run: |
          for f in plugin.json .claude-plugin/*.json skills.sh.json $(ls .cursor-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json .github/plugin/*.json 2>/dev/null); do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done
      - name: Claude Code plugin validation (strict)
        run: npx --yes @anthropic-ai/claude-code@2.1.328 plugin validate . --strict
