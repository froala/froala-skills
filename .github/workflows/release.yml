name: Release assets

# When a GitHub release is published, build the Agent Skills Discovery index
# (index.json plus one .tar.gz per skill) and attach it to the release.
# Host those files at https://froala.com/.well-known/agent-skills/ so that
# `npx skills add https://froala.com` installs the skills.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the assets to'
        required: true

permissions:
  contents: read

jobs:
  # Runs the repo's scripts and downloads packages from npm, so it gets a read-only token.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to commit SHAs; the tag is in the trailing comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # refs/tags/ makes the checkout fail unless the input is an existing tag (not a branch or SHA).
          ref: refs/tags/${{ github.event.release.tag_name || github.event.inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the skills before packaging them
        run: |
          node tests/run-negative-tests.mjs
          node scripts/validate-skills.mjs --froala declared
      - name: Build the discovery index
        run: node scripts/build-discovery-index.mjs --out dist/agent-skills
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skills
          path: dist/agent-skills/
          if-no-files-found: error

  # Only this job can write to the repository, and it runs no repo code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-skills
          path: dist/agent-skills
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: gh release upload "$TAG" dist/agent-skills/* --clobber --repo "$GITHUB_REPOSITORY"
